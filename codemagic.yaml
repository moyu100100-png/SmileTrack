workflows:
  ios-release:
    name: iOS Release
    max_build_duration: 60
    integrations:
      app_store_connect: Codemagic
    environment:
      xcode: 16.3
      ios_signing:
        distribution_type: app_store
        bundle_identifier: app.smiletrack.app
      groups:
        - code_signing
      vars:
        XCODE_PROJECT: "App.xcodeproj"
        XCODE_SCHEME: "App"
    scripts:
      - name: Install dependencies
        script: npm install
      - name: Capacitor sync
        script: npx cap sync ios
      - name: Restore AppDelegate.swift (cap syncが上書きするため)
        script: echo "" | base64 --decode > ios/App/App/AppDelegate.swift
      - name: Restore Package.swift with RevenueCat SDK (no plugin conflict)
        script: echo "" | base64 --decode > ios/App/CapApp-SPM/Package.swift
      - name: Convert alarm sounds to caf
        script: |
          for i in 1 2 3 4 5; do
            afconvert -f caff -d LEI16 www/sounds/tone${i}.mp3 ios/App/App/tone${i}.caf
          done
      - name: Set build number
        script: |
          BUILD_NUMBER=86
          echo "Setting build number to: $BUILD_NUMBER"
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $BUILD_NUMBER" ios/App/App/Info.plist
      - name: Set up keychain
        script: keychain initialize
      - name: Add p12 certificate to keychain
        script: |
          echo "$CM_CERTIFICATE" | base64 --decode > /tmp/certificate.p12
          keychain add-certificates --certificate /tmp/certificate.p12 --certificate-password "$CM_CERTIFICATE_PASSWORD"
      - name: Fetch provisioning profiles
        script: |
          app-store-connect fetch-signing-files "app.smiletrack.app" \
            --type IOS_APP_STORE \
            --create
      - name: Set up code signing
        script: xcode-project use-profiles
      - name: Debug xcodebuild errors
        script: |
          set +e
          xcodebuild \
            -project "ios/App/$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -destination "generic/platform=iOS" \
            clean build \
            DEVELOPMENT_TEAM=ZR6V257AVF \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            CODE_SIGN_STYLE=Manual \
            2>&1 | grep -E "^(error:|fatal error:|warning:.*error|.*Build.*error)" | head -30
          set -e
      - name: Build iOS
        script: |
          xcode-project build-ipa \
            --project "ios/App/$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
  android-release:
    name: Android Release
    max_build_duration: 60
    environment:
      android_signing:
        - keystore_reference
      vars:
        PACKAGE_NAME: "app.smiletrack.app"
    scripts:
      - name: Install dependencies
        script: npm install
      - name: Capacitor sync
        script: npx cap sync android
      - name: Build Android
        script: |
          cd android
          ./gradlew bundleRelease
    artifacts:
      - android/app/build/outputs/bundle/release/*.aab
    publishing:
      google_play:
        credentials: $GCLOUD_SERVICE_ACCOUNT_CREDENTIALS
        track: internal
