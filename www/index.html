<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
  <meta name="mobile-web-app-capable" content="yes"/>
  <meta name="theme-color" content="#D4788A"/>
  <meta name="description" content="マウスピース矯正管理アプリ"/>
  <link rel="manifest" href="manifest.json"/>
  <title>SmileTrack</title>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="capacitor.js"></script>

  <script>
  const ADMOB_APP_ID    = "ca-app-pub-5456814091467820~1944092541";
  const ADMOB_BANNER_ID = "ca-app-pub-3940256099942544/2934735716"; // テスト
  const ADMOB_INTER_ID  = "ca-app-pub-3940256099942544/4411468910"; // テスト

  window.AdMobHelper = {
    _interCount: 0,
    _isNative() {
      return typeof Capacitor !== "undefined" && Capacitor.isNativePlatform?.();
    },
    async initialize() {
      if (!this._isNative()) return;
      try {
        await Capacitor.Plugins.AdMob.initialize({
          requestTrackingAuthorization: true,
          testingDevices: [],
          initializeForTesting: true,
        });
      } catch(e) { console.warn("[AdMob] initialize error", e); }
    },
    async showBanner() {
      if (!this._isNative()) return;
      try {
        await Capacitor.Plugins.AdMob.removeBanner().catch(()=>{});
        await Capacitor.Plugins.AdMob.showBanner({
          adId: ADMOB_BANNER_ID,
          adSize: "BANNER",
          position: "BOTTOM_CENTER",
          margin: 0,
          isTesting: true,
        });
      } catch(e) { console.warn("[AdMob] showBanner error", e); }
    },
    async hideBanner() {
      if (!this._isNative()) return;
      try { await Capacitor.Plugins.AdMob.hideBanner(); } catch(e) {}
    },
    async removeBanner() {
      if (!this._isNative()) return;
      try { await Capacitor.Plugins.AdMob.removeBanner(); } catch(e) {}
    },
    async prepareInterstitial() {
      if (!this._isNative()) return;
      try {
        await Capacitor.Plugins.AdMob.prepareInterstitial({
          adId: ADMOB_INTER_ID,
          isTesting: true,
        });
      } catch(e) { console.warn("[AdMob] prepareInterstitial error", e); }
    },
    async showInterstitialIfReady(forceShow=false) {
      if (!this._isNative()) return;
      this._interCount++;
      if (!forceShow && this._interCount % 6 !== 0) return;
      try {
        await Capacitor.Plugins.AdMob.showInterstitial();
        setTimeout(() => this.prepareInterstitial(), 1000);
      } catch(e) {
        console.warn("[AdMob] showInterstitial error", e);
        this.prepareInterstitial();
      }
    },
  };

  window.RC_API_KEY_IOS = "appl_HrDpuICDgfGShogHiNmlmBubJSJ";
  window.RC_ENTITLEMENT = "premium";
  window.RC_PRODUCTS = {
    monthly:  "app.smiletrack.app.premium.monthly",
    yearly:   "app.smiletrack.app.premium.yearly",
    lifetime: "app.smiletrack.app.premium.lifetime",
    no_ads:   "app.smiletrack.app.no_ads",
    coffee:   "app.smiletrack.app.coffee",
  };

  // 公式 @revenuecat/purchases-capacitor ラッパー
  window.Purchases = {
    _isNative() {
      return typeof Capacitor !== "undefined" && Capacitor.isNativePlatform?.();
    },
    _plugin() {
      return Capacitor?.Plugins?.Purchases;
    },
    _configured: false,
    async configure() {
      if (!this._isNative()) return;
      if (this._configured) return;
      const plugin = this._plugin();
      if (!plugin) return;
      try {
        // appUserID指定なし → RCが匿名IDを自動管理
        // アンインストール後はrestorePurchases()で復元可能
        await plugin.configure({ apiKey: window.RC_API_KEY_IOS });
        this._configured = true;
        console.log("[RC] configured OK");
      } catch(e) { console.warn("[RC] configure error", e); }
    },
    async getOfferings() {
      if (!this._isNative()) return { current: null, all: {} };
      const plugin = this._plugin();
      if (!plugin) {
        return { current: null, all: {} };
      }
      try {
        const result = await plugin.getOfferings();
        const current = result?.current ?? null;
        const pkgCount = current?.availablePackages?.length ?? 0;
        return result ?? { current: null, all: {} };
      } catch(e) {
        return { current: null, all: {} };
      }
    },
    _getActive(info) {
      // customerInfoでラップされている場合と直接の場合の両方に対応
      const customerData = info?.customerInfo ?? info;
      const active = customerData?.entitlements?.active ?? {};
      return active;
    },
    async isPremiumUser() {
      if (!this._isNative()) return false;
      const plugin = this._plugin();
      if (!plugin) return false;
      try {
        const info = await plugin.getCustomerInfo();
        return this._getActive(info)["premium"] != null;
      } catch(e) { return false; }
    },
    async hasNoAds() {
      if (!this._isNative()) return false;
      const plugin = this._plugin();
      if (!plugin) return false;
      try {
        const info = await plugin.getCustomerInfo();
        return this._getActive(info)["no_ads"] != null;
      } catch(e) { return false; }
    },
    async purchaseProduct(productId) {
      if (!this._isNative()) throw new Error("native only");
      const plugin = this._plugin();
      if (!plugin) throw new Error("Purchases plugin not found");
      // 公式プラグインはpackage単位で購入するためofferingsから探す
      const offerings = await plugin.getOfferings();
      const allPkgs = offerings?.current?.availablePackages ?? [];
      const pkg = allPkgs.find(p => p.product?.identifier === productId);
      if (!pkg) throw new Error("Product not found: " + productId);
      const result = await plugin.purchasePackage({ aPackage: pkg });
      return result;
    },
    async restorePurchases() {
      if (!this._isNative()) throw new Error("native only");
      const plugin = this._plugin();
      if (!plugin) throw new Error("Purchases plugin not found");
      const result = await plugin.restorePurchases();
      // getCustomerInfoと同じ方法でactiveを取得
      const customerData = result?.customerInfo ?? result;
      const active = customerData?.entitlements?.active ?? {};
      return {
        isPremium: active["premium"] != null,
        noAds: active["no_ads"] != null,
      };
    },
  };
  </script>
  <script>
  const Notif = {
    async requestPermission(){
      try{
        const {LocalNotifications}=Capacitor.Plugins;
        const perm=await LocalNotifications.requestPermissions();
        return perm.display==="granted";
      }catch(e){return false;}
    },
    async schedule(id,title,body,atMs,sound=null,isAlarm=false){
      try{
        const {LocalNotifications}=Capacitor.Plugins;
        const notif={id,title,body,schedule:{at:new Date(atMs)}};
        if(sound) notif.sound=sound;
        if(isAlarm) notif.actionTypeId="ALARM_CATEGORY";
        await LocalNotifications.schedule({notifications:[notif]});
      }catch(e){console.warn("通知エラー:",e);}
    },
    async cancel(ids){
      try{
        const {LocalNotifications}=Capacitor.Plugins;
        await LocalNotifications.cancel({notifications:ids.map(id=>({id}))});
      }catch(e){}
    },
    isCapacitor(){return typeof Capacitor!=="undefined"&&Capacitor.isNativePlatform?.();},
    async checkPermission(){
      try{
        const {LocalNotifications}=Capacitor.Plugins;
        const r=await LocalNotifications.checkPermissions();
        return r.display==="granted";
      }catch(e){return false;}
    },
    async openSettings(){
      try{
        await Capacitor.Plugins.App.openUrl({url:"app-settings:"});
      }catch(e){console.warn("設定を開けません",e);}
    }
  };
  </script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
    #root { width: 100%; height: 100%; }
    @keyframes rcSpin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel" data-presets="react" src="js/storage.js"></script>
  <script type="text/babel" data-presets="react" src="js/i18n.js"></script>
  <script type="text/babel" data-presets="react" src="js/constants.js"></script>
  <script type="text/babel" data-presets="react" src="js/utils.js"></script>
  <script type="text/babel" data-presets="react" src="js/modals.js"></script>
  <script type="text/babel" data-presets="react" src="js/home.js"></script>
  <script type="text/babel" data-presets="react" src="js/calendar.js"></script>
  <script type="text/babel" data-presets="react" src="js/photo.js"></script>
  <script type="text/babel" data-presets="react" src="js/timer.js"></script>
  <script type="text/babel" data-presets="react" src="js/stats.js"></script>
  <script type="text/babel" data-presets="react" src="js/app.js"></script>
</body>
</html>
