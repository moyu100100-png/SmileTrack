<head>

  <title>SmileTrack</title>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="capacitor.js"></script>
  <script>
  // ── RevenueCat プラグイン登録 ─────────────────────────────────────────────
  // Capacitorはdevicereadyを待たず即時登録でOK（Cordova時代の概念は不要）
  function _initRC() {
    try {
      const isNative = typeof Capacitor !== "undefined"
        && Capacitor.isNativePlatform
        && Capacitor.isNativePlatform();
      console.log("[RC] isNativePlatform:", isNative);
      if (isNative && Capacitor.registerPlugin) {
        Capacitor.registerPlugin('RCBridge');
        console.log("[RC] RCBridge registered:", typeof Capacitor?.Plugins?.RCBridge);
      }
    } catch(e) { console.error("[RC] init error:", e); }
  }
  // capacitor.js読み込み直後に即時実行
  _initRC();
  // 念のためDOMContentLoaded後にも再実行
  document.addEventListener("DOMContentLoaded", _initRC);
  </script>
  <script>
  // ── AdMob 設定 ────────────────────────────────────────────────────────────
  const ADMOB_APP_ID    = "ca-app-pub-5456814091467820~1944092541";
  const ADMOB_BANNER_ID = "ca-app-pub-3940256099942544/2934735716";
  const ADMOB_INTER_ID  = "ca-app-pub-3940256099942544/4411468910";

  window.AdMobHelper = {
    _interCount: 0,
    _isNative() {
      return typeof Capacitor !== "undefined" && Capacitor.isNativePlatform?.();
    },
    async initialize() {
      if (!this._isNative()) return;
      try {
        await Capacitor.Plugins.AdMob.initialize({
          requestTrackingAuthorization: true,
          testingDevices: [],
          initializeForTesting: true,
        });
      } catch(e) { console.warn("[AdMob] initialize error", e); }
    },
    async showBanner() {
      if (!this._isNative()) return;
      try {
        await Capacitor.Plugins.AdMob.removeBanner().catch(()=>{});
        await Capacitor.Plugins.AdMob.showBanner({
          adId: ADMOB_BANNER_ID,
          adSize: "BANNER",
          position: "BOTTOM_CENTER",
          margin: 0,
          isTesting: true,
        });
      } catch(e) { console.warn("[AdMob] showBanner error", e); }
    },
    async hideBanner() {
      if (!this._isNative()) return;
      try { await Capacitor.Plugins.AdMob.hideBanner(); } catch(e) {}
    },
    async removeBanner() {
      if (!this._isNative()) return;
      try { await Capacitor.Plugins.AdMob.removeBanner(); } catch(e) {}
    },
    async prepareInterstitial() {
      if (!this._isNative()) return;
      try {
        await Capacitor.Plugins.AdMob.prepareInterstitial({
          adId: ADMOB_INTER_ID,
          isTesting: true,
        });
      } catch(e) { console.warn("[AdMob] prepareInterstitial error", e); }
    },
    async showInterstitialIfReady(forceShow=false) {
      if (!this._isNative()) return;
      this._interCount++;
      if (!forceShow && this._interCount % 6 !== 0) return;
      try {
        await Capacitor.Plugins.AdMob.showInterstitial();
        setTimeout(() => this.prepareInterstitial(), 1000);
      } catch(e) {
        console.warn("[AdMob] showInterstitial error", e);
        this.prepareInterstitial();
      }
    },
  };
  // ── RevenueCat ラッパー ───────────────────────────────────────────────────
  window.RC_API_KEY_IOS = "appl_HrDpuICDgfGShogHiNmlmBubJSJ";
  window.RC_ENTITLEMENT = "premium";
  window.RC_PRODUCTS = {
    monthly:  "app.smiletrack.app.premium.monthly",
    yearly:   "app.smiletrack.app.premium.yearly",
    lifetime: "app.smiletrack.app.premium.lifetime",
    no_ads:   "app.smiletrack.app.no_ads",
    coffee:   "app.smiletrack.app.coffee",
  };
  window.Purchases = {
    _isNative() {
      return typeof Capacitor !== "undefined" && Capacitor.isNativePlatform?.();
    },

    // Swift側のRCBridgeプラグインを取得
    _plugin() {
      return Capacitor?.Plugins?.RCBridge;
    },

    async configure() {
      // Swift側AppDelegateで初期化済みなので何もしない
      return;
    },

    async getOfferings() {
      if (!this._isNative()) return { current: null, all: {} };
      const plugin = this._plugin();
      if (!plugin) { console.error("[RC] RCBridge plugin not found"); return { current: null, all: {} }; }
      try {
        const result = await plugin.getOfferings();
        console.log("[RC] getOfferings raw:", JSON.stringify(result));
        // packagesリストをcurrent.availablePackages形式に変換
        const pkgs = (result.packages || []).map(p => ({
          identifier: p.packageIdentifier,
          product: { identifier: p.identifier, priceString: p.priceString },
        }));
        return { current: { availablePackages: pkgs }, all: {} };
      } catch(e) { console.error("[RC] getOfferings error:", e); return { current: null, all: {} }; }
    },

    async isPremiumUser() {
      if (!this._isNative()) return false;
      const plugin = this._plugin();
      if (!plugin) return false;
      try {
        const result = await plugin.getCustomerInfo();
        return result.isPremium === true;
      } catch(e) { return false; }
    },

    async hasNoAds() {
      if (!this._isNative()) return false;
      const plugin = this._plugin();
      if (!plugin) return false;
      try {
        const result = await plugin.getCustomerInfo();
        return result.noAds === true;
      } catch(e) { return false; }
    },

    async purchaseProduct(productId) {
      if (!this._isNative()) throw new Error("native only");
      const plugin = this._plugin();
      if (!plugin) throw new Error("RCBridge plugin not found");
      const result = await plugin.purchasePackage({ productId });
      return result;
    },

    async restorePurchases() {
      if (!this._isNative()) throw new Error("native only");
      const plugin = this._plugin();
      if (!plugin) throw new Error("RCBridge plugin not found");
      return await plugin.restorePurchases();
    },
  };
  </script>
  <script>
  const Notif = {
    async requestPermission(){
      try{
        const {LocalNotifications}=Capacitor.Plugins;
        const perm=await LocalNotifications.requestPermissions();
        return perm.display==="granted";
      }catch(e){return false;}
    },
    async schedule(id,title,body,atMs,sound=null,isAlarm=false){
      try{
        const {LocalNotifications}=Capacitor.Plugins;
        const notif={
          id,title,body,
          schedule:{at:new Date(atMs)},
        };
        if(sound) notif.sound=sound;
        if(isAlarm) notif.actionTypeId="ALARM_CATEGORY";
        await LocalNotifications.schedule({notifications:[notif]});
      }catch(e){console.warn("通知エラー:",e);}
    },
    async cancel(ids){
      try{
        const {LocalNotifications}=Capacitor.Plugins;
        await LocalNotifications.cancel({notifications:ids.map(id=>({id}))});
      }catch(e){}
    },
    isCapacitor(){return typeof Capacitor!=="undefined"&&Capacitor.isNativePlatform?.();},
    async checkPermission(){
      try{
        const {LocalNotifications}=Capacitor.Plugins;
        const r=await LocalNotifications.checkPermissions();
        return r.display==="granted";
      }catch(e){return false;}
    },
    async openSettings(){
      try{
        await Capacitor.Plugins.App.openUrl({url:"app-settings:"});
      }catch(e){console.warn("設定を開けません",e);}
    }
  };
  </script>
